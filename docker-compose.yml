services:
  postgres:
    image: postgres:16-alpine
    container_name: sfbm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-budget_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-budget_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-family_budget_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-budget_user} -d ${POSTGRES_DB:-family_budget_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sfbm_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sfbm_backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-budget_user}:${POSTGRES_PASSWORD:-budget_secure_password}@postgres:5432/${POSTGRES_DB:-family_budget_db}
      DATABASE_SYNC_URL: postgresql+psycopg2://${POSTGRES_USER:-budget_user}:${POSTGRES_PASSWORD:-budget_secure_password}@postgres:5432/${POSTGRES_DB:-family_budget_db}
      ALLOWED_CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sfbm_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sfbm_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - sfbm_network

volumes:
  postgres_data:
    driver: local

networks:
  sfbm_network:
    driver: bridge
