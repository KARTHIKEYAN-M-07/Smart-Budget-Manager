services:
  # Internal Private PostgreSQL Database (Isolated on backend_net)
  postgres:
    image: postgres:16-alpine
    container_name: sfbm_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_backend_net

  # Internal Redis for Task Queue & Caching
  redis:
    image: redis:7-alpine
    container_name: sfbm_redis_prod
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-strong_redis_password}"]
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-strong_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_backend_net

  # FastAPI Backend (Gunicorn + Uvicorn Workers)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sfbm_backend_prod
    restart: always
    command: ["gunicorn", "-w", "4", "-k", "uvicorn.workers.UvicornWorker", "app.main:app", "--bind", "0.0.0.0:8000"]
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_SYNC_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD:-strong_redis_password}@redis:6379/0
      ALLOWED_CORS_ORIGINS: ${APP_DOMAIN:-http://localhost}
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_SAMESITE: "lax"
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal_backend_net
      - internal_proxy_net

  # Celery Background Automation Worker
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sfbm_celery_prod
    restart: always
    command: ["celery", "-A", "app.core.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_SYNC_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD:-strong_redis_password}@redis:6379/0
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal_backend_net

  # Production Frontend & Nginx Reverse Proxy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: sfbm_frontend_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - internal_proxy_net

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local

networks:
  # Strictly internal network for DB and Cache (no external exposure)
  internal_backend_net:
    driver: bridge
    internal: true
  # Proxy network between Nginx and Backend
  internal_proxy_net:
    driver: bridge
