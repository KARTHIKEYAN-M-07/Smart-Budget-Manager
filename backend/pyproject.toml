[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sfbm-backend"
version = "0.1.0"
description = "Smart Family Budget Manager - Backend Monolith"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.8.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "alembic>=1.14.0",
    "cryptography>=44.0.0",
    "argon2-cffi>=23.1.0",
    "aiosqlite>=0.21.0",
    "python-multipart>=0.0.20",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "C4", "UP"]
ignore = ["B008", "S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S106"]
"alembic/*" = ["E501", "W291"]

[tool.bandit]
exclude_dirs = ["tests", "alembic"]
skips = ["B101"]
