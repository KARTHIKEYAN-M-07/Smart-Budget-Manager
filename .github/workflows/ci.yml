name: Continuous Integration & Security Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-checks:
    name: Backend Lint, Test & Security Audit
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: budget_user
          POSTGRES_PASSWORD: budget_secure_password
          POSTGRES_DB: family_budget_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Code Linting & Formatting (Ruff)
        run: |
          ruff check backend/
          ruff format --check backend/

      - name: Static Security Analysis (Bandit)
        run: |
          bandit -r backend/app -ll

      - name: Dependency Vulnerability Audit (pip-audit)
        run: |
          pip-audit -r backend/requirements.txt

      - name: Run Backend Tests (pytest)
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          DATABASE_SYNC_URL: sqlite:///:memory:
          ENVIRONMENT: test
        run: |
          cd backend
          pytest tests/ -v --cov=app --cov-report=term-missing

  frontend-checks:
    name: Frontend Lint, Test & Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Dependency Vulnerability Audit (npm audit)
        working-directory: ./frontend
        run: npm audit --audit-level=high

  secret-scan:
    name: Secret & Credential Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
